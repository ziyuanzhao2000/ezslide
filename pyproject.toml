[project]
name = "ezslide"
version = "0.3.0"
description = "Wrapper around tifffile to interface with wsidata for easy accessing microscopy image data."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

authors = [{ name = "Ziyuan Zhao", email = "zhaoziyuan2000@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "dask>=2026.5",
    "imagecodecs>=2026.5",
    "lazy-loader>=0.4",
    "numpy>=1.24",
    "pillow>=10.0",
    "tensorstore>=0.1.85",
    "tifffile>=2026.5.2", # loosened from 2026.7.31
    "wsidata>=0.11.0",
    "zarr>=3.0",
]

[project.optional-dependencies]
torch = ["torch"]

[project.scripts]
ezslide = "ezslide.cli:main"

[project.urls]
Homepage = "https://github.com/ziyuanzhao2000/ezslide"
Issues = "https://github.com/ziyuanzhao2000/ezslide/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "lazyslide>=0.12.0",
    "matplotlib>=3.11.1",
    "mesoslide",
]

[tool.uv.sources]
mesoslide = { path = "/n/scratch/users/z/ziz531/meson", editable = true }
